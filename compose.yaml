services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: scamshield
      POSTGRES_USER: scamshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U scamshield -d scamshield']
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://scamshield:${POSTGRES_PASSWORD}@db:5432/scamshield
    depends_on:
      db:
        condition: service_healthy
    command: [python, -m, alembic, upgrade, head]
    restart: 'no'
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://scamshield:${POSTGRES_PASSWORD}@db:5432/scamshield
      RATE_LIMIT_BACKEND: database
      APP_ENV: development
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8000:8000'
volumes:
  pgdata:
