name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scamshield_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d scamshield_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI_POSTGRES_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/scamshield_test
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check frontend/app.js && node --check frontend/config.js
      - run: PUBLIC_API_ORIGIN=https://example.onrender.com node scripts/build_frontend.mjs
      - run: docker build -t scamshield-ci .
      - name: Dependency audit (fails on known vulnerabilities)
        run: python -m pip install pip-audit && python -m pip_audit -r requirements.txt
